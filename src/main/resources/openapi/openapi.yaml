openapi: 3.0.3
info:
  title: AR-WC3 API
  description: >
    Contrat OpenAPI de l'application AR-WC3. Ce contrat est la source de
    vérité pour le client HTTP généré côté Angular (voir `ng-openapi-gen.json`)
    ainsi que pour le serveur mocké Mockoon (voir `mockoon/environment.json`).

    Authentification : JWT (Bearer). `/login` est la seule route publique ;
    elle reçoit les identifiants dans le corps de la requête et retourne un
    jeton signé à durée de vie courte (15 min) à replacer dans l'en-tête
    `Authorization: Bearer <token>` de toutes les autres requêtes.
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Serveur mocké (Mockoon)
  - url: http://localhost:8080
    description: Backend Spring Boot (implémentation réelle)

# Sécurité appliquée par défaut à toutes les opérations.
# Une opération peut l'annuler avec `security: []` (cas de /login).
security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentification
  - name: statistics
    description: Statistiques du tableau de bord
  - name: dossier-sinistre
    description: Gestion des dossiers sinistre

paths:
  /login:
    post:
      tags: [auth]
      summary: >
        Authentifie un utilisateur à partir de ses identifiants et retourne
        un jeton JWT ainsi que son profil
      operationId: login
      security: []          # route publique : pas de jeton requis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /prestations-prevoyance/sinistre/{idSinistre}:
    get:
      tags: [sinistre]
      summary: Détail d'un sinistre
      operationId: getSinistreDetails
      security:
        - bearerAuth: []
      parameters:
        - name: idSinistre
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sinistre détaillé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinistreDetails'
        '401':
          description: Jeton absent, invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /prestations-prevoyance/dossier-sinistre/{idDossier}:
    get:
      tags: [dossier-sinistre]
      summary: Détail d'un dossier sinistre
      operationId: getDossierSinistreDetails
      security:
        - bearerAuth: []
      parameters:
        - name: idDossier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dossier sinistre détaillé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierSinistreDetails'
        '401':
          description: Jeton absent, invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /prestations-prevoyance/dossier-sinistre/recherche:
    post:
      tags: [dossier-sinistre]
      summary: Recherche paginée des dossiers sinistre
      operationId: rechercherDossiersSinistre
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierSinistreCriteria'
      responses:
        '200':
          description: Page de dossiers sinistre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDossierSinistre'
        '401':
          description: Jeton absent, invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /statistics:
    get:
      tags: [statistics]
      summary: Récupère les statistiques utilisées par les 4 graphiques du tableau de bord
      operationId: getStatistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistiques du tableau de bord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
        '401':
          description: Jeton absent, invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Numéro de la page (commence à 0)

    size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      description: Nombre d'éléments par page

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Jeton JWT signé (HS256) obtenu via `POST /login`, à envoyer sur chaque
        requête dans l'en-tête `Authorization: Bearer <token>`.
        Durée de validité : 15 minutes.

  schemas:
  
    SexeEnum:
      type: string
      description: Libellés du mnémonique SEXE (2 valeurs)
      x-legacy-mnemo: 'SEXE'
      enum: ['M', 'MME']


    MotifFinEnum:
      type: string
      description: Libellés du mnémonique HISTO_MOTI (31 valeurs)
      x-legacy-mnemo: 'HISTO_MOTI'
      enum: ['CREATION', 'REPRISE_TRAVAIL', 'ABSENCE_JUSTIFICATIFS', 'DECES', 'RETRAITE', 'DECISION_ASSUREUR', 'MISE_INVALIDITE', 'CONGE_MATERNITE', 'CONGE_PARENTAL', 'ERREUR_SAISIE', 'DECISION_SOCIETE', 'ARRET_INFERIEUR_A_FRANCHISE', 'FIN_INDEMNISATION_IJSS', 'PAIEMENT_DOSSIER', 'CHANGEMENT_PATHOLOGIE', 'MI_TEMPS_THERAP_NON_INDEMNISE', 'CONTRAT_RESILIE', 'PRESTATION_NULLE', 'RECHUTE', 'DOSSIER_CONTROLE', 'REOUVERTURE_DOSSIER', 'PLUS_COURTIER', 'RUPTURE_CONTRAT_TRAVAIL', 'ASSURE_E_ANI', 'AUTRE', 'DEMANDE_EXPERTISE_MC', 'DEMANDE_EXPERTISE_ASSUREUR', 'RETOUR_EXPERTISE_MC', 'RETOUR_EXPERTISE_ASSUREUR', 'SUIVI_ASSUREUR', 'CREATION_VIA_EXTRANET']

    RisqueEnum:
      type: string
      description: Libellés du mnémonique RISQ (9 valeurs)
      x-legacy-mnemo: 'RISQ'
      enum: ['FRAIS_SANTE', 'DECES', 'INVALIDITE', 'INCAPACITE_TRAVAIL', 'RENTE_EDUCATION', 'RENTE_CONJOINT', 'DECES_ACCIDENTEL', 'ASSISTANCE', 'INDIVIDUELLE_ACCIDENT']
    
    ProfilUtilisateurEnum:
      type: string
      description: Libellés de la table LBLEPRFL
      x-legacy-name: 'LBLEPRFL'
      enum: ['CONSULTATION_ET_PEC', 'RESPONSABLE_PREVOYANCE', 'ADJOINT', 'GESTIONNAIRE_SUPPORT', 'GESTIONNAIRE_AFFILIATIONS', 'CONSULTATION', 'GESTIONNAIRE_PREVOYANCE', 'ADMINISTRATEUR', 'NON_UTILISABLE', 'GESTIONNAIRE_COTISATIONS', 'COMPTABILITE', 'GESTIONNAIRE_DECOMPTEUR', 'CONTROLE_PRESTATIONS', 'PERSONNEL_SORTI', 'PLATEFORME_TELEPHONIQUE', 'FRONT_OFFICE', 'PARAMETRAGE', 'APPORTEUR']
    
    EtatSinistrePrevoyanceEnum:
      type: string
      description: Libellés du mnémonique HISTO_SITU (2 valeurs)
      x-legacy-mnemo: 'HISTO_SITU'
      x-legacy-column: 'HISTO_SNTR_PREV.ETAT'
      enum: ['EN_COURS', 'FERME']

    TypeCorrespondantEnum:
      type: string
      description: >-
        Type de la correspondance (= nature côté back)
        Qualité du correspondant vis-à-vis de l'objet visé (8 valeurs).
        Portée par CORRESPONDANT.NAT_CORRES et non par CORRESPONDANT.TYPE_CORRES.
      x-legacy-mnemo: 'NAT_CORRES'
      x-legacy-column: 'CORRESPONDANT.NAT_CORRES'
      enum: ['SOUSCRIPTEUR', 'ASSUREUR', 'ASSURE', 'BENEFICIAIRE', 'TUTEUR', 'MEDECIN', 'TIERS', 'TRESOR_PUBLIC']
    
    TypeCalculEnum:
      type: string
      description: >-
        Mode de calcul de la prestation (3 valeurs), porté par
        REPARTITION.TYPE_CALC et GAR_PREV.TYPE_CALC.
      x-legacy-mnemo: 'TCALC'
      enum: ['SUR_ARRETS', 'PERIODIQUE', 'UNIQUE']

    PaginatedResponse:
      type: object
      required:
        - page
        - pageSize
        - count
        - totalCount
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        count:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int64
    
    Utilisateur:
      type: object
      description: Utilisateur de l'application
      required:
        - id
      properties:
        id:
          type: integer
          description: Numéro de l'utilisateur (NUMUTIL)
        nom:
          type: string
          description: Nom de l'utilisateur
        profil:
          $ref: '#/components/schemas/ProfilUtilisateurEnum'
    
    DossierSinistreCriteria:
      type: object
      properties:
        numeroDossierContains:
          type: string
          description: Recherche partielle (contains) sur le numéro de dossier
        numeroAssureContains:
          type: string
          description: Recherche partielle (contains) sur le numéro d'assuré
        numeroContrat:
          type: integer
          format: int64
          description: Recherche exacte sur le numéro de contrat
        anterieur:
          type: boolean
          description: Filtre sur le caractère antérieur du dossier
        finNull:
          type: boolean
          description: Filtre sur la période de fin absente (= dossier actif)
        prenomIndividuContains:
          type: string
          description: Recherche partielle (contains) sur le prénom de l'individu
        nomIndividuContains:
          type: string
          description: Recherche partielle (contains) sur le nom de l'individu
        debutFrom:
          type: string
          format: date
          description: Borne inférieure de la période de début
        debutTo:
          type: string
          format: date
          description: Borne supérieure de la période de début
        finFrom:
          type: string
          format: date
          description: Borne inférieure de la période de fin
        finTo:
          type: string
          format: date
          description: Borne supérieure de la période de fin

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: olivier.mignot83
        password:
          type: string
          format: password
          example: changeit

    LoginResponse:
      type: object
      required:
        - success
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        success:
          type: boolean
          example: true
        accessToken:
          type: string
          description: Jeton JWT signé
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJvbGl2aWVyIn0.xxxxx
        tokenType:
          type: string
          description: Schéma à utiliser dans l'en-tête Authorization
          default: Bearer
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Durée de validité restante du jeton, en secondes
          example: 900
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUser:
      type: object
      required:
        - username
        - displayName
      properties:
        username:
          type: string
          example: olivier.mignot83
        displayName:
          type: string
          example: Olivier Mignot
        avatarInitials:
          type: string
          example: OM

    PageDossierSinistre:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DossierSinistre'

    DossierSinistreDetails:
      description: >
        Vue détaillée d'un dossier sinistre : reprend tous les attributs de
        DossierSinistre et y ajoute les données propres au détail.
      allOf:
        - $ref: '#/components/schemas/DossierSinistre'
        - type: object
          properties:
            sinistres:
              type: array
              items:
                $ref: '#/components/schemas/Sinistre'
            gestionnaire:
              description: Utilisateur gestionnaire
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Utilisateur'
    
    Sinistre:
      type: object
      description: Un sinistre
      required:
        - idSinistre
      properties:
        idSinistre:
          type: string
          description: Identifiant unique du sinistre (clé primaire)
        dateSurvenance:
          type: string
          format: date-time
          nullable: true
          description: Date de survenance du sinistre
        dateFin:
          type: string
          format: date-time
          nullable: true
          description: Date de fin du sinistre
        risque:
          $ref: '#/components/schemas/RisqueEnum'
        motifFin:
          $ref: '#/components/schemas/MotifFinEnum'

    GarantieContrat:
      type: object
      description: Une garantie d'un contrat
      required:
        - idGarantie
      properties:
        idGarantie:
          type: string
          description: Identifiant unique da la garantie (clé primaire)
        libelle:
          type: string
          x-legacy: SELECT LIBELLE FROM GAR_CNTRT_REF
          description: Libellé de la garantie, pas d'enum, peut-etre un clean de data à faire (Décès-Incapacité-Invalidité, ENFANT A CHARGE, Décès-Incapacité-Invalidité ANI)
        dateEffet:
          type: string
          format: date
          nullable: true
          description: Date effet garantie
        dateFin:
          type: string
          format: date
          nullable: true
          description: Date fin garantie
        idContrat:
          type: string
          description: numéro du contrat associé
        numeroReferenceContrat:
          type: string
          description: numéro de reference du contrat associé
        typeCalcul:
          $ref: '#/components/schemas/TypeCalculEnum'
        valide:
          type: boolean
    
    Correspondant:
      type: object
      description: Un correspondant d'un sinistre (objet generique)
      properties:
        type:
          $ref: '#/components/schemas/TypeCorrespondantEnum'
        sexeCorrespondant:
          type: string
          description: Sexe du correspondant (si personne physique)
        nomCorrespondant:
          type: string
          description: Nom du correspondant (Prenom Nom pour personne physique, Nom pour personne morale)
        sexeInterlocuteur:
          type: string
          description: Sexe de l'interlocuteur (si personne physique)
        nomInterlocuteur:
          type: string
          description: Nom de l'interlocuteur

    SinistreLigneHistorique:
      type: object
      description: Une ligne d'historique d'une mise à jour de sinistre
      properties:
        dateEffet:
          type: string
          format: date-time
          nullable: true
          description: Date effet sinistre (historique)
        etat:
          $ref: '#/components/schemas/EtatSinistrePrevoyanceEnum'
        motifFin:
          $ref: '#/components/schemas/MotifFinEnum'
        dateSaisie:
          type: string
          format: date-time
          nullable: true
          description: Date effet sinistre (historique)
        nomGestionnaire:
          type: string
        
    SinistreDetails:
      description: >
        Vue détaillée d'un sinistre : reprend tous les attributs de
        Sinistre et y ajoute les données propres au détail.
      allOf:
        - $ref: '#/components/schemas/Sinistre'
        - type: object
          properties:
            dateDeclaration:
              type: string
              format: date-time
              nullable: true
              description: Date de déclaration du sinistre
            datePriseEnCharge:
              type: string
              format: date-time
              nullable: true
              description: Date de prise en charge du sinistre
            datePriseEnChargeCalculee:
              type: string
              format: date-time
              nullable: true
              description: Date de prise en charge calculée du sinistre
            gestionnaire:
              description: Utilisateur gestionnaire
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Utilisateur'
            assure:
              $ref: '#/components/schemas/Individu'            
            garanties:
              type: array
              items:
                $ref: '#/components/schemas/GarantieContrat'
            beneficiaires:
              type: array
              items:
                $ref: '#/components/schemas/Individu'
            correspondants:
              type: array
              items:
                $ref: '#/components/schemas/Correspondant'
            historique:
              type: array
              items:
                $ref: '#/components/schemas/SinistreLigneHistorique'

    ChartDatum:
      type: object
      description: Un point de données pour un graphique de type "pie"
      required:
        - name
        - value
      properties:
        name:
          type: string
          example: Catégorie A
        value:
          type: number
          format: double
          example: 42

    StatisticsResponse:
      type: object
      required:
        - stat1
        - stat2
        - stat3
        - stat4
      properties:
        stat1:
          type: array
          items:
            $ref: '#/components/schemas/ChartDatum'
        stat2:
          type: array
          items:
            $ref: '#/components/schemas/ChartDatum'
        stat3:
          type: array
          items:
            $ref: '#/components/schemas/ChartDatum'
        stat4:
          type: array
          items:
            $ref: '#/components/schemas/ChartDatum'

    DossierSinistre:
      type: object
      description: Représente un dossier sinistre (table ARTHUS.DOSSIER_SINISTRE)
      required:
        - idDossier
      properties:
        idDossier:
          type: string
          maxLength: 9
          description: Identifiant unique du dossier (clé primaire)
          example: '123456789'
        numeroContrats:
          type: array
          items:
            type: integer
            format: int64
          description: Numéro du ou des contrats associés
        refExt:
          type: string
          maxLength: 30
          nullable: true
          default: 'N'
          description: Référence externe
        assure:
          $ref: '#/components/schemas/Individu'
        anterieur:
          type: string
          maxLength: 1
          nullable: true
          description: Indicateur antérieur (O/N)
          example: 'N'
        debut:
          type: string
          format: date-time
          nullable: true
          description: Date de début du dossier
        fin:
          type: string
          format: date-time
          nullable: true
          description: Date de fin du dossier
        cloture:
          type: string
          format: date-time
          nullable: true
          description: Date de clôture du dossier

    Individu:
      type: object
      description: Représente un individu (table ARTHUS.INDIVIDU)
      required:
        - numindiv
      properties:
        numindiv:
          type: integer
          format: int64
          description: Identifiant unique de l'individu
        type:
          type: integer
          format: int32
        nom:
          type: string
          maxLength: 30
        qualite:
          type: integer
          format: int32
        prenom:
          type: string
          maxLength: 30
        datnais:
          type: string
          format: date
        refcie:
          type: string
          maxLength: 30
        codcourrier1:
          type: integer
          format: int32
        codcourrier2:
          type: integer
          format: int32
        codtitre:
          type: integer
          format: int32
        sexe:
          type: integer
          format: int32
        potentiel:
          type: integer
          format: int32
        nomjf:
          type: string
          maxLength: 30
        creation:
          type: string
          format: date
        maj:
          type: string
          format: date
        numutil:
          type: integer
          format: int32
        numassu:
          type: integer
          format: int64
        typassu:
          type: integer
          format: int32
        typadr:
          type: integer
          format: int32
        regime:
          type: string
          maxLength: 2
        orgbase:
          type: integer
          format: int32
        matorg:
          type: string
          maxLength: 20
        cless:
          type: integer
          format: int32
        rang:
          type: integer
          format: int32
        natur:
          type: string
          maxLength: 2
        caisse:
          type: string
          maxLength: 3
        tel:
          type: string
          maxLength: 45
        fax:
          type: string
          maxLength: 15
        adr1:
          type: string
          maxLength: 30
        adr2:
          type: string
          maxLength: 30
        codpos:
          type: string
          maxLength: 5
        ville:
          type: string
          maxLength: 30
        codpays:
          type: integer
          format: int32
        guichetorg:
          type: string
          maxLength: 3
        cle:
          type: string
          maxLength: 1
        guichetpmt:
          type: string
          maxLength: 5
        email:
          type: string
          maxLength: 45
        datnaisRegime:
          type: string
          maxLength: 6
        modificateur:
          type: integer
          format: int32
        deces:
          type: string
          format: date
        nInsee:
          type: string
          maxLength: 20
        regime2:
          type: string
          maxLength: 2
        caisse2:
          type: string
          maxLength: 3
        guichetorg2:
          type: string
          maxLength: 3
        matorg2:
          type: string
          maxLength: 20
        cless2:
          type: integer
          format: int32
        lieunais:
          type: string
          maxLength: 30
        codpaysnais:
          type: integer
          format: int32
        coddepnais:
          type: string
          maxLength: 2
        codcomnais:
          type: string
          maxLength: 5

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Identifiants invalides
