# Environnement : local (avec db sur docker)
oracle:
  jdbc:
    host: localhost
    port: 1521
    service: GEREP19CL

spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/GEREP19CL
    username: system
    password: local_oracle_password
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    properties:
      hibernate:
        default_schema: ARTHUS
        synonyms: true
  liquibase:
    url: jdbc:oracle:thin:@//localhost:1521/GEREP19CL?internal_logon=sysdba
    user: sys
    password: local_oracle_password
