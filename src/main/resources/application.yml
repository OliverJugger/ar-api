spring:
  application:
    name: arthus-nova-api
  profiles:
    active: "@arthus.profile.name@"
  config:
    import: "optional:@arthus.profile.path@/"
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  cache:
    type: none

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html

oracle:
  jdbc:
    url-prefix:
      jdbc:oracle:thin:@

server:
  port: 8080

logging:
  level:
    com.arwc3: DEBUG